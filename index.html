<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Materialuttag V1</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#111827}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{padding:22px 20px 14px;background:#111827;color:#fff}.top h1{margin:0;font-size:25px}.sub{opacity:.75;font-size:14px;margin-top:4px}main,section{padding:18px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}button,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700}.primary{background:#111827;color:#fff;width:100%}.secondary{background:#e5e7eb;width:100%;margin-top:9px}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px}label{font-size:13px;font-weight:700}.order{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.small{font-size:12px;color:#6b7280}.item{padding:10px 0;border-bottom:1px solid #eee}.hidden{display:none}.back{background:none;padding:0;margin-bottom:12px}.ok{background:#ecfdf5;padding:12px;border-radius:12px;margin-bottom:12px}.scan{height:130px;border:2px dashed #9ca3af;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b7280;margin:8px 0}</style></head><body><div class="app"><header class="top"><h1>Materialuttag</h1><div class="sub" id="shiftInfo"></div></header><main id="home"><div class="card"><b>Dagens arbetsorder</b><div id="orders"></div><button class="secondary" onclick="show('newOrder')">＋ NY ARBETSORDER</button></div><div class="card"><button class="primary" onclick="acute()">🚨 AKUT UTTAG</button></div><div class="card"><b>Dagens uttag</b><div id="count" class="small"></div><button class="secondary" onclick="show('list')">VISA UTTAG</button></div><div class="card"><button class="secondary" onclick="show('shift')">SKIFT / ANVÄNDARE</button><button class="secondary" onclick="csv()">EXPORTERA EXCEL (CSV)</button></div></main><section id="newOrder" class="hidden"><button class="back" onclick="show('home')">← Tillbaka</button><div class="card"><h2>Ny arbetsorder</h2><label>Ordernummer / kostnadsställe</label><input id="ono"><label>Maskin / beskrivning (valfritt)</label><input id="machine"><button class="primary" onclick="addOrder()">SKAPA ARBETSORDER</button></div></section><section id="shift" class="hidden"><button class="back" onclick="show('home')">← Tillbaka</button><div class="card"><h2>Skift / användare</h2><label>Skiftkod</label><input id="scode" placeholder="t.ex. 4827"><label>Namn / signatur</label><input id="user" placeholder="t.ex. Stefan K"><button class="primary" onclick="saveShift()">SPARA</button><p class="small">V1 sparar lokalt. Gemensam synkning kommer senare.</p></div></section><section id="withdraw" class="hidden"><button class="back" onclick="show('home')">← Avbryt</button><div class="card"><h2 id="wt">Materialuttag</h2><div id="sel" class="ok"></div><label>EAMA-nummer</label><input id="art" placeholder="EAMA01078"><div class="scan">QR-kamera kopplas in i nästa steg.<br>Testa V1 genom att skriva EAMA-numret.</div><label>Antal uttaget</label><input id="qty" type="number" min="1" value="1"><label>Antal kvar <span class="small">(frivilligt)</span></label><input id="rem" type="number" min="0"><button class="secondary" onclick="addItem()">＋ LÄGG TILL ARTIKEL</button><div id="pending"></div><button class="primary" style="margin-top:10px" onclick="register()">REGISTRERA UTTAG</button></div></section><section id="list" class="hidden"><button class="back" onclick="show('home')">← Tillbaka</button><div class="card"><h2>Registrerade uttag</h2><div id="withdrawals"></div></div></section></div><script>const K='mu_v1';let db=JSON.parse(localStorage.getItem(K)||'{"shift":"","user":"","orders":[],"withdrawals":[]}'),cur=null,items=[],isAcute=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(db));render()}function show(id){document.querySelectorAll('main,section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){$('shiftInfo').textContent=db.shift?`Skift ${db.shift} – ${db.user||'ingen signatur'}`:'Inget aktivt skift';$('orders').innerHTML=db.orders.length?db.orders.map((o,i)=>`<div class="order"><div><b>${esc(o.no)}</b><div class="small">${esc(o.machine||'')}</div></div><button onclick="select(${i})">VÄLJ</button></div>`).join(''):'<p class="small">Inga arbetsorder ännu.</p>';$('count').textContent=`${db.withdrawals.length} uttag registrerade`;$('withdrawals').innerHTML=db.withdrawals.map(w=>`<div class="item"><b>${w.time}</b> · ${esc(w.article)} · ${esc(w.order)} · ${w.qty} st · ${w.rem===''?'–':w.rem} kvar · ${esc(w.user)}</div>`).join('')||'<p class="small">Inga uttag.</p>'}function addOrder(){let no=$('ono').value.trim();if(!no)return alert('Ange ordernummer/kostnadsställe.');db.orders.push({no,machine:$('machine').value.trim()});$('ono').value='';$('machine').value='';save();show('home')}function select(i){cur=db.orders[i];isAcute=false;openW()}function acute(){cur={no:''};isAcute=true;openW()}function openW(){show('withdraw');$('wt').textContent=isAcute?'Akut uttag':'Materialuttag';$('sel').innerHTML=isAcute?'🚨 <b>Akut uttag</b>':'<b>'+esc(cur.no)+'</b> '+esc(cur.machine||'');items=[];pending.innerHTML='';$('art').value='';$('qty').value=1;$('rem').value=''}function addItem(){let a=$('art').value.trim().toUpperCase(),q=+$('qty').value;if(!a||!q)return alert('Ange EAMA-nummer och antal.');if(isAcute&&!cur.no){let o=prompt('Ange kostnadsställe/order:');if(!o)return;cur.no=o.trim()}items.push({a,q,r:$('rem').value});$('art').value='';$('qty').value=1;$('rem').value='';$('pending').innerHTML=items.map((x,i)=>`<div class="item"><b>${esc(x.a)}</b> – ${x.q} st ${x.r===''?'':'· '+x.r+' kvar'} <button onclick="items.splice(${i},1);addItemRender()">×</button></div>`).join('')}function addItemRender(){$('pending').innerHTML=items.map((x,i)=>`<div class="item"><b>${esc(x.a)}</b> – ${x.q} st ${x.r===''?'':'· '+x.r+' kvar'} <button onclick="items.splice(${i},1);addItemRender()">×</button></div>`).join('')}function register(){if(!items.length)return alert('Lägg till minst en artikel.');if(!db.user)return alert('Ange namn/signatur under SKIFT / ANVÄNDARE.');let t=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});items.forEach(x=>db.withdrawals.push({time:t,article:x.a,order:cur.no,qty:x.q,rem:x.r,user:db.user}));items=[];save();show('home')}function saveShift(){db.shift=$('scode').value.trim();db.user=$('user').value.trim();save();show('home')}function csv(){if(!db.withdrawals.length)return alert('Inga uttag.');let r=[['Klockslag','EAMA-nr','Kostnadsställe/order','Antal uttaget','Antal kvar','Signatur'],...db.withdrawals.slice().sort((a,b)=>a.order.localeCompare(b.order)||a.time.localeCompare(b.time)).map(w=>[w.time,w.article,w.order,w.qty,w.rem,w.user])];let c=r.map(x=>x.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download='materialuttag.csv';a.click()}render()</script></body></html>
